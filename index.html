<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildi - 3D Editör</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f9; height: 100vh; overflow: hidden; }
        .container { width: 300px; margin: 100px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 10px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; cursor: pointer; color: white; border: none; border-radius: 4px; font-weight: bold; }
        #loginBtn { background: #007bff; }
        #signupBtn { background: #28a745; }
        #logoutBtn { background: #dc3545; width: 100%; }
        .hidden { display: none !important; }

        #addBtn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #007bff; border-radius: 12px; border: none; color: white; font-size: 30px; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        #threeDBox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; }
        #sideMenu { position: absolute; left: 0; top: 0; width: 140px; height: 100%; background: #333; color: white; padding: 20px; z-index: 102; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

<!-- Giriş Ekranı -->
<div class="container" id="authBox">
    <h2>Buildi</h2>
    <input type="email" id="email" placeholder="E-posta">
    <input type="password" id="password" placeholder="Şifre">
    <button id="loginBtn">Giriş Yap</button>
    <button id="signupBtn">Kayıt Ol</button>
</div>

<!-- Panel Ekranı -->
<div class="container hidden" id="appBox">
    <h2>Buildi Paneli</h2>
    <button id="logoutBtn">Çıkış Yap</button>
    <button id="addBtn">+</button>
</div>

<!-- 3D Sahne Ekranı -->
<div id="threeDBox" class="hidden">
    <div id="sideMenu">
        <h3>Menu</h3>
        <button onclick="addCube()" style="background:#444;">+ Küp Ekle</button>
        <button onclick="alert('Efektler Yakında')" style="background:#444;">Efektler</button>
        <button onclick="alert('Dışa Aktarılıyor')" style="background:#444;">Dışa Aktar</button>
        <button onclick="deleteSelected()" style="background:#dc3545;">Sil</button>
        <hr style="width:100%">
        <button onclick="document.getElementById('threeDBox').classList.add('hidden')" style="background:#555;">Kapat</button>
    </div>
</div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { TransformControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/TransformControls.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Firebase Ayarları
    const firebaseConfig = { apiKey: "AIzaSyD4aZLmTWyPEZCkUsA8SdKVU6_xJ0qv0HA", authDomain: "buildi-86fe0.firebaseapp.com", projectId: "buildi-86fe0", storageBucket: "buildi-86fe0.firebasestorage.app", messagingSenderId: "291512419220", appId: "1:291512419220:web:d5c4961e0dcd55de00c581" };
    initializeApp(firebaseConfig);
    const auth = getAuth();

    // 3D Sahne Kurulumu
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('threeDBox').appendChild(renderer.domElement);
    camera.position.set(0, 2, 5);

    const orbit = new OrbitControls(camera, renderer.domElement);
    const control = new TransformControls(camera, renderer.domElement);
    scene.add(control);
    control.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);

    let objects = [];
    window.addCube = () => {
        const cube = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshNormalMaterial());
        scene.add(cube);
        objects.push(cube);
        control.attach(cube);
    };

    window.deleteSelected = () => {
        if (control.object) {
            scene.remove(control.object);
            objects = objects.filter(obj => obj !== control.object);
            control.detach();
        }
    };

    window.addEventListener('pointerdown', (e) => {
        if(e.clientX < 140) return;
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1), camera);
        const intersects = raycaster.intersectObjects(objects);
        if(intersects.length > 0) control.attach(intersects[0].object);
    });

    onAuthStateChanged(auth, (user) => {
        document.getElementById('authBox').classList.toggle('hidden', !!user);
        document.getElementById('appBox').classList.toggle('hidden', !user);
    });

    // Giriş ve Kayıt İşlemleri (Garanti Yöntem)
    document.getElementById('loginBtn').onclick = function() {
        const emailInput = document.getElementById('email').value;
        const passInput = document.getElementById('password').value;
        if (!emailInput || !passInput) { alert("E-posta ve şifre girin!"); return; }

        signInWithEmailAndPassword(auth, emailInput, passInput)
            .catch((error) => { alert("Giriş Hatası: " + error.code); });
    };

    document.getElementById('signupBtn').onclick = function() {
        const emailInput = document.getElementById('email').value;
        const passInput = document.getElementById('password').value;
        if (!emailInput || !passInput) { alert("E-posta ve şifre girin!"); return; }

        createUserWithEmailAndPassword(auth, emailInput, passInput)
            .then(() => { alert("Kayıt başarılı!"); })
            .catch((error) => { alert("Kayıt Hatası: " + error.code); });
    };

    document.getElementById('logoutBtn').onclick = () => signOut(auth);
    document.getElementById('addBtn').onclick = () => document.getElementById('threeDBox').classList.remove('hidden');

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
