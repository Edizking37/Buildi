<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buildi - Stüdyo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-size: 14px; pointer-events: none; }
        
        #sidebar { 
            position: absolute; top: 0; right: -300px; width: 260px; height: 100%; 
            background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); 
            transition: right 0.3s ease; color: white; padding: 20px; z-index: 10; overflow-y: auto; 
        }
        #sidebar.open { right: 0; }
        
        #menu-btn { position: absolute; top: 20px; right: 20px; background: #00ffcc; border: none; padding: 10px; font-weight: bold; border-radius: 8px; z-index: 11; cursor: pointer; }
        .action-btn { width: 100%; padding: 12px; margin-bottom: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .section-title { color: #00ffcc; margin: 15px 0 5px 0; font-size: 14px; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

    <div id="info">Nesneyi seç, taşı, uzat veya kaydet!</div>
    <button id="menu-btn">Menü ☰</button>

    <div id="sidebar">
        <h3>Buildi Araçlar</h3>
        
        <div class="section-title">Nesneler</div>
        <button class="action-btn" onclick="addNewShape('cube')" style="background:#00ffcc">Yeni Küp</button>
        <button class="action-btn" onclick="addNewShape('sphere')" style="background:#3357ff; color:white">Yeni Küre</button>
        
        <div class="section-title">Efektler</div>
        <button class="action-btn" onclick="applyEffect('glow')" style="background:#ff33f3; color:white">Glow Efekti</button>
        <button class="action-btn" onclick="applyEffect('wireframe')" style="background:#9933ff; color:white">Wireframe</button>
        
        <div class="section-title">Dışa Aktar</div>
        <button class="action-btn" onclick="exportAsZip('glb')" style="background:#ffaa00">GLB Klasör İndir (.zip)</button>
        <button class="action-btn" onclick="exportAsZip('fbx')" style="background:#cc00ff; color:white">FBX Klasör İndir (.zip)</button>
        
        <div class="section-title">İşlemler</div>
        <button class="action-btn" onclick="deleteSelectedObject()" style="background:#ff3333; color:white">Sil</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-fbx-exporter@1.0.0/dist/three-fbx-exporter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        scene.add(new THREE.GridHelper(10, 10, 0x444444, 0x222222));

        let objects = [], selectedObject = null, activeHandle = null;
        const handlesGroup = new THREE.Group();
        scene.add(handlesGroup);
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        document.getElementById('menu-btn').onclick = () => document.getElementById('sidebar').classList.toggle('open');

        function createHandles(mesh) {
            handlesGroup.clear();
            if (mesh.geometry.type === 'BoxGeometry') {
                const params = mesh.geometry.parameters;
                const pos = [
                    [params.width/2, 0, 0], [-params.width/2, 0, 0],
                    [0, params.height/2, 0], [0, -params.height/2, 0],
                    [0, 0, params.depth/2], [0, 0, -params.depth/2]
                ];
                pos.forEach((p, i) => {
                    const h = new THREE.Mesh(
                        new THREE.SphereGeometry(0.2), 
                        new THREE.MeshBasicMaterial({color: 0xff0055, depthTest: false})
                    );
                    h.position.copy(mesh.position).add(new THREE.Vector3(...p));
                    h.userData = { type: 'scale', axis: i < 2 ? 'x' : i < 4 ? 'y' : 'z', sign: i % 2 === 0 ? 1 : -1 };
                    handlesGroup.add(h);
                });
            }
            const moveHandle = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.25), 
                new THREE.MeshBasicMaterial({color: 0x00ff00, depthTest: false})
            );
            moveHandle.position.copy(mesh.position).add(new THREE.Vector3(0, 1.2, 0));
            moveHandle.userData = { type: 'move' };
            handlesGroup.add(moveHandle);
        }

        function updateHandlesPosition() {
            if (!selectedObject || handlesGroup.children.length === 0) return;
            if (selectedObject.geometry.type === 'BoxGeometry') {
                const params = selectedObject.geometry.parameters;
                const pos = [
                    [params.width/2, 0, 0], [-params.width/2, 0, 0],
                    [0, params.height/2, 0], [0, -params.height/2, 0],
                    [0, 0, params.depth/2], [0, 0, -params.depth/2]
                ];
                handlesGroup.children.forEach((h, i) => {
                    if (i < pos.length) {
                        h.position.copy(selectedObject.position).add(new THREE.Vector3(...pos[i]));
                    } else {
                        h.position.copy(selectedObject.position).add(new THREE.Vector3(0, 1.2, 0));
                    }
                });
            }
        }

        function addNewShape(type) {
            const mesh = new THREE.Mesh(
                type === 'cube' ? new THREE.BoxGeometry(1,1,1) : new THREE.SphereGeometry(0.7), 
                new THREE.MeshStandardMaterial({color: 0x00ffcc})
            );
            scene.add(mesh); 
            objects.push(mesh);
            selectedObject = mesh;
            createHandles(mesh);
        }

        function applyEffect(type) {
            if(!selectedObject) return;
            
            if(type === 'glow') {
                // Eğer zaten glow varsa kapat/aç yapalım ya da parlatalım
                if(selectedObject.material.emissive.getHex() === 0x00ffff) {
                    selectedObject.material.emissive.setHex(0x000000);
                } else {
                    selectedObject.material.emissive.setHex(0x00ffff);
                }
                selectedObject.material.needsUpdate = true;
            }
            
            if(type === 'wireframe') {
                selectedObject.material.wireframe = !selectedObject.material.wireframe;
                selectedObject.material.needsUpdate = true;
            }
        }

        function deleteSelectedObject() {
            if(selectedObject) { 
                scene.remove(selectedObject); 
                objects = objects.filter(o => o !== selectedObject); 
                selectedObject = null; 
                handlesGroup.clear(); 
            }
        }

        function exportAsZip(format) {
            let fileName = prompt("Zip dosyasının adını girin (Örn: projem.zip):", "buildi_proje.zip");
            if (!fileName) return;

            if (!fileName.endsWith('.zip')) {
                alert("adının sonuna .zip koyun!");
                return;
            }

            let folderName = fileName.slice(0, -4);
            if (!folderName) folderName = "proje";

            const zip = new JSZip();
            const folder = zip.folder(folderName);
            
            if (format === 'glb') {
                const exporter = new THREE.GLTFExporter();
                exporter.parse(scene, (gltf) => {
                    folder.file("models.glb", JSON.stringify(gltf));
                    folder.file("effects.glb", JSON.stringify({ version: "1.0", active: selectedObject ? true : false }));
                    zip.generateAsync({type:"blob"}).then(blob => downloadFile(blob, fileName));
                }, {binary: true});
            } 
            else if (format === 'fbx') {
                const exporter = new THREE.FBXExporter();
                const fbxData = exporter.parse(scene);
                folder.file("models.fbx", fbxData);
                folder.file("effects.fbx", JSON.stringify({ version: "1.0", active: selectedObject ? true : false }));
                zip.generateAsync({type:"blob"}).then(blob => downloadFile(blob, fileName));
            }
        }

        function downloadFile(blob, name) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
        }

        window.addEventListener('pointerdown', (e) => {
            mouse.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(handlesGroup.children);
            if (intersects.length > 0) { 
                activeHandle = intersects[0].object; 
                controls.enabled = false; 
                return; 
            }
            
            const objIntersects = raycaster.intersectObjects(objects);
            if (objIntersects.length > 0) { 
                selectedObject = objIntersects[0].object; 
                createHandles(selectedObject); 
            } else {
                handlesGroup.clear();
                selectedObject = null;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!activeHandle || !selectedObject) return;
            
            if (activeHandle.userData.type === 'move') {
                const movement = new THREE.Vector3(e.movementX * 0.01, -e.movementY * 0.01, 0);
                selectedObject.position.add(movement);
            } else {
                const {axis, sign} = activeHandle.userData;
                const p = selectedObject.geometry.parameters;
                let w = p.width || 1, h = p.height || 1, d = p.depth || 1;
                
                if(axis === 'x') w = Math.max(0.1, w + e.movementX * 0.01 * sign);
                if(axis === 'y') h = Math.max(0.1, h - e.movementY * 0.01 * sign);
                if(axis === 'z') d = Math.max(0.1, d + e.movementX * 0.01 * sign);
                
                selectedObject.geometry.dispose();
                selectedObject.geometry = new THREE.BoxGeometry(w, h, d);
            }
            updateHandlesPosition();
        });

        window.addEventListener('pointerup', () => { 
            activeHandle = null; 
            controls.enabled = true; 
        });

        function animate() { 
            requestAnimationFrame(animate); 
            controls.update(); 
            renderer.render(scene, camera); 
        }
        animate();
    </script>
</body>
    </html>
