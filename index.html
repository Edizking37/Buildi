<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Buildi - Giriş Yap</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .container { width: 300px; display: flex; flex-direction: column; gap: 10px; }
        input { padding: 10px; }
        button { padding: 10px; cursor: pointer; background: #007bff; color: white; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Buildi'ye Hoş Geldin</h2>
    <input type="email" id="email" placeholder="E-posta">
    <input type="password" id="password" placeholder="Şifre">
    <button id="loginBtn">Giriş Yap</button>
    <button id="signupBtn" style="background:#28a745;">Kayıt Ol</button>
</div>

<script type="module">
    // Firebase SDK'larını CDN üzerinden yüklüyoruz
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4aZLmTWyPEZCkUsA8SdKVU6_xJ0qv0HA",
      authDomain: "buildi-86fe0.firebaseapp.com",
      projectId: "buildi-86fe0",
      storageBucket: "buildi-86fe0.firebasestorage.app",
      messagingSenderId: "291512419220",
      appId: "1:291512419220:web:d5c4961e0dcd55de00c581"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Kayıt Ol Butonu
    document.getElementById('signupBtn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        createUserWithEmailAndPassword(auth, email, password)
            .then(() => alert("Kayıt başarılı!"))
            .catch(err => alert("Hata: " + err.message));
    });

    // Giriş Yap Butonu
    document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, password)
            .then(() => alert("Giriş başarılı!"))
            .catch(err => alert("Hata: " + err.message));
    });
</script>

</body>
</html>
