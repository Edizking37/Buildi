<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Buildi</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; height: 100vh; margin: 0; }
        .container { width: 300px; display: flex; flex-direction: column; gap: 10px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; cursor: pointer; color: white; border: none; border-radius: 4px; font-weight: bold; }
        #loginBtn { background: #007bff; }
        #signupBtn { background: #28a745; }
        #logoutBtn { background: #dc3545; }
        .hidden { display: none !important; }

        /* Mavi Artı Butonu */
        #addBtn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: #007bff; border-radius: 12px; border: none;
            color: white; font-size: 30px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
        }

        /* 3D Oluşturma Ekranı */
        #threeDBox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<!-- Giriş Ekranı -->
<div class="container" id="authBox">
    <h2>Buildi</h2>
    <input type="email" id="email" placeholder="E-posta">
    <input type="password" id="password" placeholder="Şifre">
    <button id="loginBtn">Giriş Yap</button>
    <button id="signupBtn">Kayıt Ol</button>
</div>

<!-- Uygulama Ana Ekranı -->
<div class="container hidden" id="appBox">
    <h2>Buildi Paneli</h2>
    <button id="logoutBtn">Çıkış Yap</button>
    <!-- Mavi Artı Butonu -->
    <button id="addBtn">+</button>
</div>

<!-- 3D Oluşturma Ekranı (Başlangıçta Gizli) -->
<div id="threeDBox" class="hidden">
    <h2>3D Oluşturma</h2>
    <p>Buraya 3D modelleme aracını ekleyeceğiz.</p>
    <button onclick="document.getElementById('threeDBox').classList.add('hidden')">Geri Dön</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4aZLmTWyPEZCkUsA8SdKVU6_xJ0qv0HA",
      authDomain: "buildi-86fe0.firebaseapp.com",
      projectId: "buildi-86fe0",
      storageBucket: "buildi-86fe0.firebasestorage.app",
      messagingSenderId: "291512419220",
      appId: "1:291512419220:web:d5c4961e0dcd55de00c581"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // DOM Elemanları
    const authBox = document.getElementById('authBox');
    const appBox = document.getElementById('appBox');
    const threeDBox = document.getElementById('threeDBox');

    // Oturum Kontrolü
    onAuthStateChanged(auth, (user) => {
        if (user) {
            authBox.classList.add('hidden');
            appBox.classList.remove('hidden');
        } else {
            authBox.classList.remove('hidden');
            appBox.classList.add('hidden');
        }
    });

    // Buton İşlemleri
    document.getElementById('addBtn').addEventListener('click', () => {
        threeDBox.classList.remove('hidden');
    });

    document.getElementById('signupBtn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        createUserWithEmailAndPassword(auth, email, password).catch(err => alert(err.message));
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, password).catch(err => alert(err.message));
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        signOut(auth);
    });
</script>

</body>
</html>
