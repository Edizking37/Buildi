<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildi - 3D Editör</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f4f4f9; height: 100vh; overflow: hidden; }
        .container { width: 300px; margin: 100px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 10px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; cursor: pointer; color: white; border: none; border-radius: 4px; font-weight: bold; }
        #loginBtn { background: #007bff; }
        #signupBtn { background: #28a745; }
        #logoutBtn { background: #dc3545; width: 100%; }
        .hidden { display: none !important; }

        #addBtn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #007bff; border-radius: 12px; border: none; color: white; font-size: 30px; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        #threeDBox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; }
        #sideMenu { position: absolute; left: 0; top: 0; width: 140px; height: 100%; background: #333; color: white; padding: 20px; z-index: 102; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

<!-- Giriş Ekranı -->
<div class="container" id="authBox">
    <h2>Buildi</h2>
    <input type="email" id="email" placeholder="E-posta">
    <input type="password" id="password" placeholder="Şifre">
    <button id="loginBtn" type="button">Giriş Yap</button>
    <button id="signupBtn" type="button">Kayıt Ol</button>
</div>

<!-- Panel Ekranı -->
<div class="container hidden" id="appBox">
    <h2>Buildi Paneli</h2>
    <button id="logoutBtn" type="button">Çıkış Yap</button>
    <button id="addBtn" type="button">+</button>
</div>

<!-- 3D Sahne Ekranı -->
<div id="threeDBox" class="hidden">
    <div id="sideMenu">
        <h3>Menu</h3>
        <button id="addCubeBtn" type="button" style="background:#444;">+ Küp Ekle</button>
        <button onclick="alert('Efektler Yakında')" type="button" style="background:#444;">Efektler</button>
        <button onclick="alert('Dışa Aktarılıyor')" type="button" style="background:#444;">Dışa Aktar</button>
        <button id="deleteBtn" type="button" style="background:#dc3545;">Sil</button>
        <hr style="width:100%">
        <button onclick="document.getElementById('threeDBox').classList.add('hidden')" type="button" style="background:#555;">Kapat</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { TransformControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/TransformControls.js';

    // Firebase Ayarları
    const firebaseConfig = { 
        apiKey: "AIzaSyD4aZLmTWyPEZCkUsA8SdKVU6_xJ0qv0HA", 
        authDomain: "buildi-86fe0.firebaseapp.com", 
        projectId: "buildi-86fe0", 
        storageBucket: "buildi-86fe0.firebasestorage.app", 
        messagingSenderId: "291512419220", 
        appId: "1:291512419220:web:d5c4961e0dcd55de00c581" 
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Giriş/Kayıt DOM Bağlantıları
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const addBtn = document.getElementById('addBtn');

    loginBtn.addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!email || !password) { alert("Lütfen alanları doldurun!"); return; }

        signInWithEmailAndPassword(auth, email, password)
            .catch(err => alert("Giriş Hatası: " + err.message));
    });

    signupBtn.addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!email || !password) { alert("Lütfen alanları doldurun!"); return; }

        createUserWithEmailAndPassword(auth, email, password)
            .then(() => alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz."))
            .catch(err => alert("Kayıt Hatası: " + err.message));
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authBox').classList.add('hidden');
            document.getElementById('appBox').classList.remove('hidden');
        } else {
            document.getElementById('authBox').classList.remove('hidden');
            document.getElementById('appBox').classList.add('hidden');
        }
    });

    // 3D Sahne Kurulumu
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('threeDBox').appendChild(renderer.domElement);
    camera.position.set(0, 2, 5);

    const orbit = new OrbitControls(camera, renderer.domElement);
    const control = new TransformControls(camera, renderer.domElement);
    scene.add(control);
    control.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);

    let objects = [];

    document.getElementById('addCubeBtn').addEventListener('click', () => {
        const cube = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshNormalMaterial());
        scene.add(cube);
        objects.push(cube);
        control.attach(cube);
    });

    document.getElementById('deleteBtn').addEventListener('click', () => {
        if (control.object) {
            scene.remove(control.object);
            objects = objects.filter(obj => obj !== control.object);
            control.detach();
        }
    });

    window.addEventListener('pointerdown', (e) => {
        if(e.clientX < 140) return;
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1), camera);
        const intersects = raycaster.intersectObjects(objects);
        if(intersects.length > 0) control.attach(intersects[0].object);
    });

    addBtn.addEventListener('click', () => document.getElementById('threeDBox').classList.remove('hidden'));

    function animate() { 
        requestAnimationFrame(animate); 
        renderer.render(scene, camera); 
    }
    animate();
</script>
</body>
</html>
