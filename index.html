<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Buildi</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; }
        .container { width: 300px; display: flex; flex-direction: column; gap: 10px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; cursor: pointer; color: white; border: none; border-radius: 4px; font-weight: bold; }
        #loginBtn { background: #007bff; }
        #signupBtn { background: #28a745; }
        #logoutBtn { background: #dc3545; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Giriş / Kayıt Ekranı -->
<div class="container" id="authBox">
    <h2>Buildi</h2>
    <input type="email" id="email" placeholder="E-posta">
    <input type="password" id="password" placeholder="Şifre">
    <button id="loginBtn">Giriş Yap</button>
    <button id="signupBtn">Kayıt Ol</button>
</div>

<!-- Uygulama Ana Ekranı (Başlangıçta Gizli) -->
<div class="container hidden" id="appBox">
    <h2>Buildi Paneli</h2>
    <p id="userDisplay"></p>
    <button id="logoutBtn">Çıkış Yap</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4aZLmTWyPEZCkUsA8SdKVU6_xJ0qv0HA",
      authDomain: "buildi-86fe0.firebaseapp.com",
      projectId: "buildi-86fe0",
      storageBucket: "buildi-86fe0.firebasestorage.app",
      messagingSenderId: "291512419220",
      appId: "1:291512419220:web:d5c4961e0dcd55de00c581"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authBox = document.getElementById('authBox');
    const appBox = document.getElementById('appBox');
    const userDisplay = document.getElementById('userDisplay');

    // Kullanıcı oturum durumunu takip et
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Giriş yapmışsa ana paneli göster, giriş formunu gizle
            authBox.classList.add('hidden');
            appBox.classList.remove('hidden');
            userDisplay.textContent = user.email;
        } else {
            // Giriş yapmamışsa giriş formunu göster, paneli gizle
            authBox.classList.remove('hidden');
            appBox.classList.add('hidden');
        }
    });

    // Kayıt Ol
    document.getElementById('signupBtn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        createUserWithEmailAndPassword(auth, email, password).catch(err => alert("Hata: " + err.message));
    });

    // Giriş Yap
    document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, password).catch(err => alert("Hata: " + err.message));
    });

    // Çıkış Yap
    document.getElementById('logoutBtn').addEventListener('click', () => {
        signOut(auth);
    });
</script>

</body>
</html>
